<!DOCTYPE html>
<html>

<head>
    <title>GameZone</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: black;
            color: white;
        }

        .navbar {
            background-color: #111;
            padding: 20px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-size: 18px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
            background-image: url('https://images.unsplash.com/photo-1542751110-97427bbecf20?q=80&w=1600&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        .hero h1 {
            font-size: 70px;
            color: #a855f7;
        }

        .hero p {
            font-size: 25px;
        }

        .button {
            background-color: #a855f7;
            color: white;
            padding: 15px 35px;
            border: none;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
        }

        .games {
            padding: 50px;
            text-align: center;
        }

        .card {
            background-color: #111;
            width: 300px;
            display: inline-block;
            margin: 20px;
            border-radius: 15px;
            overflow: hidden;
        }

        .card img {
            width: 100%;
        }

        .card h2 {
            color: #a855f7;
        }

        .footer {
            background-color: #111;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
